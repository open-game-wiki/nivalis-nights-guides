<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="drinkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ec4899" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Reflection -->
  <ellipse cx="32" cy="57" rx="14" ry="3" fill="#ec4899" opacity="0.3"/>

  <!-- Glass Stem Base -->
  <ellipse cx="32" cy="55" rx="12" ry="2.5" fill="#0f172a" stroke="#ec4899" stroke-width="1.8"/>
  <line x1="32" y1="36" x2="32" y2="55" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Martini Glass Triangle Body -->
  <polygon points="12,18 52,18 32,38" fill="#111827" stroke="#f472b6" stroke-width="1.8"/>

  <!-- Glowing Cyber Cocktail Liquid -->
  <polygon points="16,22 48,22 32,38" fill="url(#drinkGrad)" filter="url(#pinkGlow)"/>

  <!-- Liquid Surface Oval -->
  <ellipse cx="32" cy="22" rx="16" ry="3" fill="#38bdf8" opacity="0.85"/>

  <!-- Straw / Cocktail Stirrer -->
  <line x1="28" y1="8" x2="36" y2="34" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>

  <!-- Neon Citrus Wedge Garnish -->
  <path d="M46 14 A8 8 0 0 1 54 22 L46 22 Z" fill="#facc15" stroke="#eab308" stroke-width="1.2"/>

  <!-- Rising Effervescent Bubbles -->
  <circle cx="28" cy="28" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="34" cy="31" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="32" cy="25" r="1.4" fill="#ffffff" opacity="0.9"/>
</svg>
