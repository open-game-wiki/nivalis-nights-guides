<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="crateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#020617" opacity="0.8"/>

  <!-- Main Cargo Container Body -->
  <rect x="12" y="22" width="40" height="32" rx="4" fill="url(#crateGrad)" stroke="#06b6d4" stroke-width="2" filter="url(#cyanGlow)"/>

  <!-- Reinforced Cyber Corners -->
  <path d="M12 28 L18 28 L18 22" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M52 28 L46 28 L46 22" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M12 48 L18 48 L18 54" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M52 48 L46 48 L46 54" fill="none" stroke="#22d3ee" stroke-width="2.5"/>

  <!-- Container Top Handle / Hatch Bar -->
  <path d="M22 22 L22 13 C22 10.5 42 10.5 42 13 L42 22" fill="none" stroke="url(#lidGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Front Digital Terminal / Hologram Screen -->
  <rect x="22" y="30" width="20" height="15" rx="2.5" fill="#082f49" stroke="#38bdf8" stroke-width="1.2"/>
  
  <!-- Digital Inventory Matrix Lines -->
  <line x1="26" y1="34" x2="38" y2="34" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="38" x2="35" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="41" x2="32" y2="41" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Status Indicator LEDs -->
  <circle cx="17" cy="30" r="1.5" fill="#22c55e"/>
  <circle cx="17" cy="35" r="1.5" fill="#38bdf8"/>
  <circle cx="47" cy="30" r="1.5" fill="#eab308"/>
  <circle cx="47" cy="35" r="1.5" fill="#ec4899"/>
</svg>
