<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="thrusterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="boatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ec4899" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Water Wake & Neon Surface Reflections -->
  <g opacity="0.8">
    <path d="M4 52 Q18 49 32 52 T60 52" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M10 56 Q26 53 42 56 T56 56" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="51" r="1" fill="#38bdf8"/>
    <circle cx="15" cy="48" r="1.2" fill="#22d3ee"/>
    <circle cx="58" cy="51" r="1" fill="#38bdf8"/>
  </g>

  <!-- Rear Thruster Plasma Trail -->
  <polygon points="6,34 2,36 6,38" fill="url(#thrusterGrad)" filter="url(#boatGlow)"/>
  <ellipse cx="7" cy="36" rx="2.5" ry="4" fill="#fb7185"/>

  <!-- Boat Main Hull (Aerodynamic Wedge) -->
  <path d="M7 33 L24 25 L55 35 C59 36.5 60 38.5 56 41 L20 45 C12 45 7 42 7 38 Z" fill="url(#hullGrad)" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- Neon Accent Stripe on Hull -->
  <path d="M11 39 L48 37 C53 37.5 55 38.5 52 40 L16 43 Z" fill="#ec4899" filter="url(#boatGlow)"/>

  <!-- Cockpit / Aero Canopy -->
  <path d="M22 28 L36 21 L47 31 L29 33 Z" fill="url(#canopyGrad)" stroke="#e0f2fe" stroke-width="1.2"/>
  <path d="M25 29 L34 24 L42 30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.75"/>

  <!-- Twin Spoiler / Stabilizer Fin -->
  <path d="M12 29 L8 19 L15 24 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="8" y1="19" x2="15" y2="24" stroke="#ec4899" stroke-width="1.2"/>

  <!-- Nose Sensor / Headlight Beam -->
  <circle cx="55.5" cy="36.5" r="1.5" fill="#22d3ee"/>
  <polygon points="56,36 63,33 63,40 56,37" fill="#22d3ee" opacity="0.35"/>
</svg>
