<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="noodleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#22d3ee" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Steam -->
  <g opacity="0.85">
    <path d="M25 18 C22 13 28 9 25 5" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M33 19 C37 14 31 10 35 5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M41 21 C38 16 44 12 41 7" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Chopsticks Resting -->
  <line x1="16" y1="12" x2="52" y2="30" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="22" y1="10" x2="56" y2="28" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bowl Base Pedestal -->
  <path d="M26 53 L25 57 C25 58.5 39 58.5 39 57 L38 53 Z" fill="#090d16" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- Bowl Body -->
  <path d="M12 30 C12 48 21 54 32 54 C43 54 52 48 52 30 Z" fill="url(#bowlGrad)" stroke="#22d3ee" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Bowl Rim -->
  <ellipse cx="32" cy="30" rx="20" ry="6.5" fill="#131929" stroke="#22d3ee" stroke-width="2"/>

  <!-- Broth -->
  <ellipse cx="32" cy="31" rx="18" ry="5.2" fill="url(#brothGrad)"/>

  <!-- Nori Sheet -->
  <path d="M16 22 L24 20 L26 31 L18 33 Z" fill="#064e3b" stroke="#047857" stroke-width="1"/>

  <!-- Noodles -->
  <path d="M22 31 Q27 27 32 31 T42 31" fill="none" stroke="url(#noodleGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M24 33 Q29 29 34 33 T44 33" fill="none" stroke="url(#noodleGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Boiled Egg Half -->
  <ellipse cx="28" cy="32" rx="4.5" ry="3.2" fill="#f8fafc"/>
  <circle cx="28" cy="32" r="2.2" fill="#ea580c"/>

  <!-- Naruto Fish Cake -->
  <circle cx="38" cy="32" r="3.8" fill="#ffffff" stroke="#ec4899" stroke-width="1"/>
  <path d="M37 31 C39 31 39 33 37 33 C36 33 36 32 38 32" fill="none" stroke="#ec4899" stroke-width="1" stroke-linecap="round"/>

  <!-- Scallions -->
  <circle cx="33" cy="29" r="1.2" fill="#22c55e"/>
  <circle cx="43" cy="33" r="1.2" fill="#22c55e"/>
  <circle cx="23" cy="33" r="1.2" fill="#22c55e"/>
</svg>
