<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="padGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#a855f7" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Gamepad Body with Grips -->
  <path d="M14 20 C18 20 22 22 32 23 C42 22 46 20 50 20 C58 20 62 26 59 44 C57 52 48 51 44 43 L40 35 C36 34 28 34 24 35 L20 43 C16 51 7 52 5 44 C2 26 6 20 14 20 Z" fill="url(#padGrad)" stroke="#a855f7" stroke-width="2" filter="url(#padGlow)"/>

  <!-- Left D-Pad (Glowing Cyan Cross) -->
  <path d="M19 26 L23 26 L23 29 L26 29 L26 33 L23 33 L23 36 L19 36 L19 33 L16 33 L16 29 L19 29 Z" fill="#22d3ee"/>

  <!-- Right Action Buttons (Glowing Neon Pink Diamond) -->
  <circle cx="45" cy="27" r="2.2" fill="#ec4899"/>
  <circle cx="49" cy="31" r="2.2" fill="#f43f5e"/>
  <circle cx="41" cy="31" r="2.2" fill="#38bdf8"/>
  <circle cx="45" cy="35" r="2.2" fill="#facc15"/>

  <!-- Center Thumbsticks / Touchpad -->
  <circle cx="27" cy="38" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="37" cy="38" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <rect x="29" y="25" width="6" height="3" rx="1.5" fill="#22d3ee" opacity="0.8"/>
</svg>
